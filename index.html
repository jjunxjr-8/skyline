<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NLCS Website Archive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  
  <style>
    .sidebar {
      display: flex;
      flex-direction: column;
      height: 100vh;
      box-sizing: border-box;
    }

    .sidebar-nav {
      flex: 1;
      overflow-y: auto;
    }

    .sidebar-footer {
      margin-top: auto;
      padding: 10px 16px;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      width: 100%;
      box-sizing: border-box;
    }

    .sidebar-logo {
      max-width: 120px;
      max-height: 40px;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
    }

    /* Modal Overlay & Container */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-card {
      background: #ffffff;
      border-radius: 16px;
      max-width: 90vw;
      max-height: 90vh;
      width: 680px;
      padding: 24px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      background: #f1f3f4;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #5f6368;
    }

    .modal-close:hover {
      background: #e8eaed;
      color: #202124;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 600;
      margin: 0 0 6px 0;
      color: var(--text-main);
    }

    .modal-url-display {
      font-size: 13px;
      color: var(--accent-blue);
      word-break: break-all;
      margin-bottom: 16px;
      text-decoration: none;
      display: inline-block;
    }

    .modal-url-display:hover {
      text-decoration: underline;
    }

    /* Image Wrapper & Zoom Lens */
    .img-preview-wrapper {
      position: relative;
      display: inline-block;
      margin: 0 auto;
      max-width: 100%;
      max-height: 60vh;
      overflow: hidden;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      cursor: crosshair;
      user-select: none;
    }

    .img-preview-wrapper img {
      display: block;
      max-width: 100%;
      max-height: 60vh;
      height: auto;
      object-fit: contain;
    }

    .zoom-square {
      position: absolute;
      width: 140px;
      height: 140px;
      border: 2px solid var(--accent-blue);
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
      border-radius: 8px;
      pointer-events: none;
      display: none;
      background-repeat: no-repeat;
      z-index: 10;
    }

    .zoom-hint {
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      margin-top: 12px;
    }
  </style>

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-JZT7E4P7HL"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-JZT7E4P7HL');
  </script>
</head>
<body>

  <div class="layout">
    <!-- Left Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <span class="logo-text"><span class="logo-accent">COSMOS</span> Account</span>
      </div>
      
      <nav class="sidebar-nav" id="sidebar-nav">
      </nav>

      <!-- Bottom Left Logo -->
      <div class="sidebar-footer">
        <img src="cosmos-logo.png" alt="COSMOS Logo" class="sidebar-logo" onerror="this.style.display='none'">
      </div>
    </aside>

    <main class="main-content">
      <section class="profile-hero">
        <div class="logo-badge">
          <img src="NLCS_logo_white.png" alt="NLCS Logo" class="hero-logo" onerror="this.style.display='none'">
        </div>
        <h1 class="user-name">COSMOS Project</h1>
        <p class="user-email">COSMOS X Student Council</p>
      </section>

      <div class="search-container">
        <div class="search-box">
          <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input class="search" id="filter" type="text" placeholder="Search archive services and links...">
        </div>
        <br>
      </div>

      <div id="groups" class="groups-container"></div>
      <p class="empty" id="empty">No such directory exists.</p>

      <footer class="footer">
        <div class="footer-disclaimer">
          <span>©COSMOS 2026-2027 • Powered by COSMOS<br>©Student Council 2026-2027 • Managed by the Student Council</span>
        </div>
      </footer>
    </main>
  </div>

  <!-- Image Viewer Modal -->
  <div id="image-modal" class="modal-overlay">
    <div class="modal-card">
      <button class="modal-close" id="modal-close">&times;</button>
      <h3 class="modal-title" id="modal-title">Image View</h3>
      <a id="modal-url-text" href="#" target="_blank" class="modal-url-display"></a>
      <div class="img-preview-wrapper" id="img-wrapper">
        <img id="modal-img" src="" alt="Preview Image">
        <div id="zoom-square" class="zoom-square"></div>
      </div>
      <p class="zoom-hint">Right-click on the image to toggle the zoom lens square</p>
    </div>
  </div>

  <script>
    const DATA = {
      "COSMOS Services": [
        { name: "COSMOS Cloud — SEC Official Society List", url: "https://cloud.nlcscosmos.com" },
        { name: "COSMOS Enterprises — SEC Official Enterprise List", url: "https://enterprise.nlcscosmos.com" },
        { name: "COSMOS RoboParts — VEX Robotics Order Service", url: "https://roboparts.nlcscosmos.com" },
        { name: "COSMOS Rankings — House Competitions Scoreboard", url: "https://houses.nlcscosmos.com" },
        { name: "COSMOS MediaCube — NLCS Publications", url: "https://mediacube.nlcscosmos.com" },
        { name: "COSMOS OneClick — AI Powered Drive Search", url: "https://nlcscosmos.com/oneclick" },
        { name: "COSMOS QuickScope — AI Powered Email Search", url: "https://nlcscosmos.com/quickscope" },
        { name: "COSMOS Larry — NLCS Library's AI Chatbot", url: "#" }
      ],
      "Maps": [
        { name: "Google Classroom", url: "https://classroom.google.com/h/st" },
        { name: "Senior School First Floor Map", url: "images/photos/map2.png" },
        { name: "Senior School Second Floor Map", url: "images/photos/map1.png" }
        { name: "Senior School Third Floor Map", url: "images/photos/map3.png" }
      ],
      "Skl stuff": [
        { name: "School Calendar", url: "#" },
        { name: "Parent Portal", url: "#" }
      ],
      "CCAs": [
        { name: "Cosmos Cloud Society List", url: "#" }
      ],
      "Support": [
        { name: "Help & Technical Support", url: "#" }
      ]
    };

    const PALETTES = [
      {
        iconBg: '#1a73e8',        
        activeBg: '#e8f0fe',
        activeText: '#1a73e8',
        cardBg: '#f4f8fe',        
        cardBorder: '#d2e3fc',
        btnBg: '#e8f0fe',         
        btnText: '#1a73e8',
        iconSvg: `<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>`
      },
      {
        iconBg: '#1e8e3e',      
        activeBg: '#e6f4ea',
        activeText: '#137333',
        cardBg: '#f3f9f5',
        cardBorder: '#ceead6',
        btnBg: '#e6f4ea',
        btnText: '#137333',
        iconSvg: `<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M20 6h-4V4c0-1.11-.89-2-2-2h-4c-1.11 0-2 .89-2 2v2H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-6 0h-4V4h4v2z"/></svg>`
      },
      {
        iconBg: '#f9ab00',        
        activeBg: '#fef7e0',
        activeText: '#b06000',
        cardBg: '#fffdf5',
        cardBorder: '#feefc3',
        btnBg: '#fef7e0',
        btnText: '#b06000',
        iconSvg: `<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82zM12 3L1 9l11 6 9-4.91V17h2V9L12 3z"/></svg>`
      },
      {
        iconBg: '#9334e6',        
        activeBg: '#f3e8fd',
        activeText: '#7627b5',
        cardBg: '#faf5fe',
        cardBorder: '#e9d2fd',
        btnBg: '#f3e8fd',
        btnText: '#7627b5',
        iconSvg: `<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>`
      },
      {
        iconBg: '#d93025',        
        activeBg: '#fce8e6',
        activeText: '#c5221f',
        cardBg: '#fdf5f5',
        cardBorder: '#fad2cf',
        btnBg: '#fce8e6',
        btnText: '#c5221f',
        iconSvg: `<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M11 18h2v-2h-2v2zm1-16C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm0-14c-2.21 0-4 1.79-4 4h2c0-1.1.9-2 2-2s2 .9 2 2c0 2-3 1.75-3 5h2c0-2.25 3-2.5 3-5 0-2.21-1.79-4-4-4z"/></svg>`
      }
    ];

    const sidebarNavEl = document.getElementById('sidebar-nav');
    const groupsEl = document.getElementById('groups');
    const emptyEl = document.getElementById('empty');
    const filterEl = document.getElementById('filter');

    // Modal & Zoom Elements
    const modalOverlay = document.getElementById('image-modal');
    const modalCloseBtn = document.getElementById('modal-close');
    const modalTitle = document.getElementById('modal-title');
    const modalUrlText = document.getElementById('modal-url-text');
    const modalImg = document.getElementById('modal-img');
    const imgWrapper = document.getElementById('img-wrapper');
    const zoomSquare = document.getElementById('zoom-square');

    let zoomActive = false;
    const ZOOM_FACTOR = 2.5;

    function isImageFile(url) {
      return /\.(png|jpe?g|gif|svg|webp)($|\?)/i.test(url) || url.startsWith('images/');
    }

    function slugify(text) {
      return text.toLowerCase().replace(/[^\w\s-]/g, '').replace(/[\s_-]+/g, '-');
    }

    function renderSidebar() {
      sidebarNavEl.innerHTML = '';
      const groupKeys = Object.keys(DATA);

      groupKeys.forEach((groupName, index) => {
        const slug = slugify(groupName);
        const palette = PALETTES[index % PALETTES.length];

        const button = document.createElement('button');
        button.className = `nav-item ${index === 0 ? 'active' : ''}`;
        
        button.style.setProperty('--item-active-bg', palette.activeBg);
        button.style.setProperty('--item-active-text', palette.activeText);

        button.innerHTML = `
          <div class="nav-icon" style="background-color: ${palette.iconBg};">
            ${palette.iconSvg}
          </div>
          <span>${groupName}</span>
        `;

        button.addEventListener('click', () => {
          document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
          button.classList.add('active');

          const targetCard = document.getElementById(`group-${slug}`);
          if (targetCard) {
            targetCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
        });

        sidebarNavEl.appendChild(button);
      });
    }

    function openImageModal(title, url) {
      modalTitle.textContent = title;
      modalUrlText.textContent = url;
      modalUrlText.href = url;
      modalImg.src = url;
      zoomActive = false;
      zoomSquare.style.display = 'none';
      modalOverlay.classList.add('active');
    }

    function closeImageModal() {
      modalOverlay.classList.remove('active');
      zoomActive = false;
      zoomSquare.style.display = 'none';
    }

    modalCloseBtn.addEventListener('click', closeImageModal);
    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) closeImageModal();
    });

    // Right-Click Zoom Toggle & Magnifier Logic
    imgWrapper.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      zoomActive = !zoomActive;

      if (zoomActive) {
        zoomSquare.style.display = 'block';
        zoomSquare.style.backgroundImage = `url('${modalImg.src}')`;
        updateZoom(e);
      } else {
        zoomSquare.style.display = 'none';
      }
    });

    imgWrapper.addEventListener('mousemove', (e) => {
      if (zoomActive) updateZoom(e);
    });

    function updateZoom(e) {
      const rect = modalImg.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      if (x < 0 || y < 0 || x > rect.width || y > rect.height) {
        zoomSquare.style.display = 'none';
        return;
      }

      zoomSquare.style.display = 'block';
      const lensW = zoomSquare.offsetWidth;
      const lensH = zoomSquare.offsetHeight;

      // Position the zoom square centered on the cursor relative to the wrapper
      const wrapperRect = imgWrapper.getBoundingClientRect();
      const posX = e.clientX - wrapperRect.left - lensW / 2;
      const posY = e.clientY - wrapperRect.top - lensH / 2;

      zoomSquare.style.left = `${posX}px`;
      zoomSquare.style.top = `${posY}px`;

      // Set scale background offset
      zoomSquare.style.backgroundSize = `${rect.width * ZOOM_FACTOR}px ${rect.height * ZOOM_FACTOR}px`;
      const bgX = -(x * ZOOM_FACTOR - lensW / 2);
      const bgY = -(y * ZOOM_FACTOR - lensH / 2);
      zoomSquare.style.backgroundPosition = `${bgX}px ${bgY}px`;
    }

    function render(query) {
      const q = (query || '').trim().toLowerCase();
      groupsEl.innerHTML = '';
      let anyVisible = false;

      const groupKeys = Object.keys(DATA);

      groupKeys.forEach((group, index) => {
        const items = DATA[group];
        const filtered = items.filter(i => i.name.toLowerCase().includes(q));
        if (filtered.length === 0) return;
        anyVisible = true;

        const palette = PALETTES[index % PALETTES.length];

        const groupCard = document.createElement('div');
        groupCard.className = 'group-card';
        groupCard.id = `group-${slugify(group)}`;
        
        groupCard.style.backgroundColor = palette.cardBg;
        groupCard.style.borderColor = palette.cardBorder;

        const title = document.createElement('h3');
        title.className = 'group-title';
        title.textContent = group;
        title.style.color = palette.activeText;
        groupCard.appendChild(title);

        const linksList = document.createElement('div');
        linksList.className = 'links-list';

        filtered.forEach(item => {
          const isImage = isImageFile(item.url);
          const buttonLabel = isImage ? 'Reveal' : 'Open';

          const a = document.createElement('a');
          a.className = 'link-row';
          a.href = item.url;
          a.style.setProperty('--row-hover-bg', palette.btnBg);

          if (!isImage) {
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
          }

          a.innerHTML = `
            <div class="link-content">
              <span class="link-bullet" style="background-color: ${palette.iconBg};"></span>
              <span class="link-name">${item.name}</span>
            </div>
            <button class="link-btn" style="background-color: ${palette.btnBg}; color: ${palette.btnText};">
              ${buttonLabel}
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M5 13h11.86l-5.43 5.43 1.42 1.42L21 12l-8.15-8.15-1.42 1.42L16.86 11H5v2z"/></svg>
            </button>
          `;

          a.addEventListener('click', (e) => {
            if (isImage) {
              e.preventDefault();
              openImageModal(item.name, item.url);
            }
          });

          linksList.appendChild(a);
        });

        groupCard.appendChild(linksList);
        groupsEl.appendChild(groupCard);
      });

      emptyEl.style.display = anyVisible ? 'none' : 'block';
    }

    renderSidebar();
    filterEl.addEventListener('input', e => render(e.target.value));
    render('');
  </script>
</body>
</html>
