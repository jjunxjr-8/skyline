<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NLCS Website Archive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  
  <style>
    /* Inline containment fixes to guarantee it fits inside the sidebar */
    .sidebar {
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      overflow: hidden;
    }

    .sidebar-nav {
      flex: 1;
      overflow-y: auto;
    }

    .sidebar-footer {
      margin-top: auto;
      padding: 16px;
      width: 100%;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sidebar-logo {
      max-width: 100%;
      max-height: 80px;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
    }
  </style>

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-JZT7E4P7HL"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-JZT7E4P7HL');
  </script>
</head>
<body>

  <div class="layout">
    <!-- Left Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <span class="logo-text"><span class="logo-accent">COSMOS</span> Account</span>
      </div>
      
      <nav class="sidebar-nav" id="sidebar-nav">
      </nav>

      <!-- Sidebar Bottom Logo Container -->
      <div class="sidebar-footer">
        <img src="cosmos-logo.png" alt="COSMOS Logo" class="sidebar-logo" onerror="this.style.display='none'">
      </div>
    </aside>

    <main class="main-content">
      <section class="profile-hero">
        <div class="logo-badge">
          <img src="NLCS_logo_white.png" alt="NLCS Logo" class="hero-logo" onerror="this.style.display='none'">
        </div>
        <h1 class="user-name">COSMOS Project</h1>
        <p class="user-email">COSMOS X Student Council</p>
      </section>

      <div class="search-container">
        <div class="search-box">
          <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input class="search" id="filter" type="text" placeholder="Search archive services and links...">
        </div>
        <br>
      </div>

      <div id="groups" class="groups-container"></div>
      <p class="empty" id="empty">No such directory exists.</p>

      <footer class="footer">
        <div class="footer-disclaimer">
          <span>©COSMOS 2026-2027 • Powered by COSMOS<br>©Student Council 2026-2027 • Managed by the Student Council</span>
        </div>
      </footer>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
