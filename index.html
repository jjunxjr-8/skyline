<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NLCS Website Archive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <style>
    .sidebar {
      display: flex;
      flex-direction: column;
      height: 100vh;
      box-sizing: border-box;
    }

    .sidebar-nav {
      flex: 1;
      overflow-y: auto;
    }

    .sidebar-footer {
      margin-top: auto;
      padding: 10px 16px;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      width: 100%;
      box-sizing: border-box;
    }

    .sidebar-logo {
      max-width: 120px;
      max-height: 40px;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
    }
  </style>

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-JZT7E4P7HL"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-JZT7E4P7HL');
  </script>
</head>
<body>

  <div class="layout">
    <!-- Left Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <span class="logo-text">COSMOS <span class="logo-accent">Violet</span></span>
      </div>
      
      <nav class="sidebar-nav" id="sidebar-nav">
      </nav>

      <!-- Bottom Left Logo -->
      <div class="sidebar-footer">
        <img src="cosmos-logo.png" alt="COSMOS Logo" class="sidebar-logo" onerror="this.style.display='none'">
      </div>
    </aside>

    <main class="main-content">
      <section class="profile-hero">
        <div class="logo-badge">
          <img src="NLCS_logo_white.png" alt="NLCS Logo" class="hero-logo" onerror="this.style.display='none'">
        </div>
        <h1 class="user-name">COSMOS Violet</h1>
        <p class="user-email">COSMOS X Student Council</p>
      </section>

      <div class="search-container">
        <div class="search-box">
          <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input class="search" id="filter" type="text" placeholder="Search archive services and links...">
        </div>
        <br>
      </div>

      <div id="groups" class="groups-container"></div>
      <p class="empty" id="empty">No such directory exists.</p>

      <footer class="footer">
        <div class="footer-disclaimer">
          <span>©COSMOS 2026-2027 • Powered by COSMOS<br>©Student Council 2026-2027 • Managed by the Student Council</span>
        </div>
      </footer>
    </main>
  </div>

  <!-- Floating Fixed OneClick Widget (Bottom Right) -->
  <a href="https://nlcscosmos.com/oneclick" target="_blank" rel="noopener noreferrer" class="oneclick-floating-widget">
    <div class="oneclick-icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
      </svg>
    </div>
    <div class="oneclick-text">
      <span class="oneclick-title">COSMOS OneClick</span>
      <span class="oneclick-sub">AI Powered Drive Search</span>
    </div>
    <svg class="oneclick-arrow" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
      <path d="M5 13h11.86l-5.43 5.43 1.42 1.42L21 12l-8.15-8.15-1.42 1.42L16.86 11H5v2z"/>
    </svg>
  </a>

  <script src="script.js"></script>
</body>
</html>
